<style>
:root {
  --navy:#10253c; --gold:#C9A84C; --gold-lt:#f5e4a0;
  --bg:#f0f4f8; --card:#fff; --border:#e2e8f0;
  --text:#1a2b3c; --muted:#64748b;
  --green:#16a34a; --red:#dc2626; --amber:#d97706;
  --r:12px; --sh:0 2px 10px rgba(16,37,60,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ─── LOGIN ─── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#0a1a2e 0%,#10253c 60%,#1a3a5c 100%);padding:24px;}
.lbox{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.35);}
.llogo{text-align:center;margin-bottom:24px;}
.llogo .br{font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-1px;}
.llogo .br span{color:var(--gold);}
.llogo .sub{font-size:12px;color:var(--muted);margin-top:3px;}
.llogo img{max-width:160px;height:auto;display:block;margin:0 auto;}
.lbox h2{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:18px;text-align:center;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.fg input,.fg select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border .2s;}
.fg input:focus,.fg select:focus{border-color:var(--gold);}
.btn-login{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s;}
.btn-login:hover{background:#1a3a5c;}
.lerr{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none;}
.ldemo{margin-top:18px;font-size:11px;color:#bbb;text-align:center;line-height:1.7;}

/* ─── APP SHELL ─── */
#app{display:none;}
.hdr{background:var(--navy);color:#fff;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.hdr-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
.hdr-brand span{color:var(--gold);}
.hdr-right{display:flex;align-items:center;gap:10px;}
.role-badge{background:rgba(201,168,76,.2);border:1px solid rgba(201,168,76,.4);color:var(--gold-lt);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.btn-out{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:11px;padding:5px 12px;border-radius:20px;cursor:pointer;}

/* ─── PERIOD BAR ─── */
.pbar{background:#fff;border-bottom:1px solid var(--border);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pbar label{font-size:12px;color:var(--muted);font-weight:600;}
.pbar select,.pbar input{border:1.5px solid var(--border);border-radius:7px;padding:5px 9px;font-size:13px;color:var(--text);background:#fff;outline:none;}
.pbar select:focus,.pbar input:focus{border-color:var(--gold);}

/* ─── CONTENT ─── */
.content{padding:14px;max-width:820px;margin:0 auto;}

/* ─── CARDS ─── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin-bottom:14px;box-shadow:var(--sh);}
.ctitle{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.ctitle .ic{font-size:17px;}

/* ─── METRIC GRID ─── */
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
@media(min-width:420px){.mg{grid-template-columns:repeat(3,1fr);}}
.mc{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px;text-align:center;box-shadow:var(--sh);}
.mc.hl{background:var(--navy);border-color:var(--navy);}
.ml{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.mc.hl .ml{color:rgba(255,255,255,.55);}
.mv{font-size:24px;font-weight:900;color:var(--navy);line-height:1;}
.mc.hl .mv{color:var(--gold);}
.ms{font-size:10px;color:var(--muted);margin-top:2px;}
.mc.hl .ms{color:rgba(255,255,255,.4);}

/* ─── INPUT GRID ─── */
.ig{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:420px){.ig{grid-template-columns:repeat(3,1fr);}}
.ii label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.ii input{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-weight:700;color:var(--text);background:#fff;outline:none;transition:border .2s;text-align:center;}
.ii input:focus{border-color:var(--gold);background:#fffdf0;}
.ii input[readonly]{background:#f8fafc;color:var(--green);cursor:default;}

/* ─── PROGRESS ─── */
.pw{margin:10px 0;}
.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.pb{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;transition:width .5s;background:var(--navy);}
.pf.g{background:var(--green);}
.pf.w{background:var(--amber);}
.pf.r{background:var(--red);}

/* ─── TAGS ─── */
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.tg{background:#dcfce7;color:#15803d;}
.ty{background:#fef9c3;color:#a16207;}
.tr{background:#fee2e2;color:#b91c1c;}

/* ─── SAVE BTN ─── */
.bsave{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s;}
.bsave:hover{background:#1a3a5c;}
.bsave.ok{background:var(--green);}
.bprint{background:var(--gold);color:var(--navy);}

/* ─── DIVIDER ─── */
.dv{height:1px;background:var(--border);margin:14px 0;}

/* ─── TABLE ─── */
.stbl{width:100%;border-collapse:collapse;font-size:13px;}
.stbl th{background:var(--navy);color:#fff;padding:9px 11px;text-align:left;font-size:11px;font-weight:700;}
.stbl td{padding:9px 11px;border-bottom:1px solid var(--border);}
.stbl tr:hover td{background:#f8fafc;}
.stbl .n{font-weight:800;color:var(--navy);text-align:right;}

/* ─── FUNNEL ─── */
.fs{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:5px;border:1px solid var(--border);background:#f8fafc;}
.fd{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.fl{font-size:13px;font-weight:500;flex:1;}
.fn{font-size:19px;font-weight:900;color:var(--navy);min-width:36px;text-align:right;}
.fp{font-size:11px;color:var(--muted);min-width:34px;text-align:right;}

/* ─── TEXTAREA ─── */
.ta{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);min-height:70px;resize:vertical;outline:none;font-family:inherit;}
.ta:focus{border-color:var(--gold);}

/* ─── SECTION HEADER ─── */
.sec-hdr{background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.sec-hdr h2{font-size:16px;font-weight:800;}
.sec-hdr p{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;}

/* ─── FM CONSOLIDATED ─── */
.fm-role{border-left:4px solid var(--gold);padding-left:12px;margin-bottom:16px;}
.fm-role h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* ─── PRINT ─── */
@media print{.hdr,.pbar,.bsave,.bprint,.btn-out{display:none!important;}.content{padding:0;}.card{break-inside:avoid;}}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════
   AUTH CONFIG
════════════════════════════════════ */
const ROLES = {
  owner:         { label:'Owner',             pass:'owner123',  color:'#534AB7' },
  floor_manager: { label:'Floor Manager',     pass:'fm123',     color:'#185FA5' },
  marketing:     { label:'Marketing Executive', pass:'mkt123',  color:'#0F6E56' },
  telecaller1:   { label:'Telecaller 1',      pass:'tc123',     color:'#854F0B' },
  telecaller2:   { label:'Telecaller 2',      pass:'tc123',     color:'#854F0B' },
  sales:         { label:'Sales Executive',   pass:'sales123',  color:'#993C1D' },
  closing:       { label:'Closing Manager',   pass:'close123',  color:'#3B6D11' },
};

const PROJECTS = {
  proj_demo:{ name:'Demo Project' },
  proj_aaa: { name:'AAA Township' },
  proj_bbb: { name:'BBB Greens' },
};

let SESSION = { role:null, project:null };

/* ════════════════════════════════════
   AUTH
════════════════════════════════════ */
function doLogin(){
  const role = document.getElementById('l-role').value;
  const proj = document.getElementById('l-project').value;
  const pass = document.getElementById('l-pass').value;
  const err  = document.getElementById('lerr');
  if(!role||!ROLES[role]){err.style.display='block';err.textContent='❌ Role निवडा';return;}
  if(!proj){err.style.display='block';err.textContent='❌ Project निवडा';return;}
  if(ROLES[role].pass !== pass){err.style.display='block';err.textContent='❌ चुकीचा password';return;}
  err.style.display='none';
  SESSION = {role, project:proj};
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('role-badge').textContent = ROLES[role].label;
  const now = new Date();
  const ymd = now.toISOString().slice(0,10);
  const ym  = ymd.slice(0,7);
  document.getElementById('p-date').value  = ymd;
  document.getElementById('p-month').value = ym;
  // set week value
  const jan4 = new Date(now.getFullYear(),0,4);
  const wn = Math.ceil(((now - jan4)/86400000 + jan4.getDay()+1)/7);
  document.getElementById('p-week').value = `${now.getFullYear()}-W${String(wn).padStart(2,'0')}`;
  togglePeriod();
  // Show FM nav for FM and Owner
  const fmNav = document.getElementById('fm-nav');
  if(fmNav) fmNav.style.display = (SESSION.role==='floor_manager'||SESSION.role==='owner') ? 'block' : 'none';
  renderForRole();
}
function doLogout(){
  SESSION={role:null,project:null};
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('l-pass').value='';
}

/* ════════════════════════════════════
   PERIOD
════════════════════════════════════ */
function togglePeriod(){
  const t = document.getElementById('p-type').value;
  document.getElementById('p-date').style.display  = t==='daily'  ?'inline-block':'none';
  document.getElementById('p-week').style.display  = t==='weekly' ?'inline-block':'none';
  document.getElementById('p-month').style.display = t==='monthly'?'inline-block':'none';
  updatePeriodLabel();
  if(SESSION.role) loadSectionData();
}
function updatePeriodLabel(){
  const t=document.getElementById('p-type').value;
  const lbl=document.getElementById('p-label');
  if(!lbl) return;
  if(t==='daily'){
    const d=document.getElementById('p-date').value;
    if(d){ const dt=new Date(d+'T00:00:00'); lbl.textContent=dt.toLocaleDateString('mr-IN',{weekday:'short',day:'numeric',month:'short'}); }
  } else { lbl.textContent=''; }
}
function onPeriodChange(){ updatePeriodLabel(); loadSectionData(); }
function getPeriod(){
  const t=document.getElementById('p-type').value;
  if(t==='daily')   return 'd_'+(document.getElementById('p-date').value||'nodate');
  if(t==='weekly')  return 'w_'+(document.getElementById('p-week').value||'noweek');
  return 'm_'+(document.getElementById('p-month').value||'nomonth');
}
function skey(section){ return `rex_${SESSION.project}_${getPeriod()}_${section}`; }
function saveD(sec,d){ localStorage.setItem(skey(sec),JSON.stringify(d)); }
function loadD(sec){ try{return JSON.parse(localStorage.getItem(skey(sec)))||{};}catch{return{};} }
function setField(id,d){ const el=document.getElementById(id); if(el&&d[id]!==undefined) el.value=d[id]; }
function getVal(id){ return parseFloat(document.getElementById(id)?.value)||0; }
function pct(a,b){ return b>0?Math.round(a/b*100):0; }
function fmtM(n){ if(n>=1e7) return '₹'+(n/1e7).toFixed(1)+'Cr'; if(n>=1e5) return '₹'+(n/1e5).toFixed(1)+'L'; if(n>=1e3) return '₹'+(n/1e3).toFixed(0)+'K'; return '₹'+n; }
function statusTag(v,g,w){ return v>=g?'<span class="tag tg">✅ चांगले</span>':v>=w?'<span class="tag ty">⚠️ ठीक</span>':'<span class="tag tr">❌ कमी</span>';}

/* ════════════════════════════════════
   RENDER ROUTER
════════════════════════════════════ */
function renderForRole(tab){
  const r = SESSION.role;
  if(r==='floor_manager'||r==='owner'){
    const t = tab||'dashboard';
    if(t==='dashboard') renderFloorManager();
    else if(t==='inventory') renderInventory();
    else if(t==='finance') renderFinance();
    else if(t==='targets') renderTargets();
    else renderFloorManager();
    // Update FM nav
    document.querySelectorAll('.fm-tab').forEach(b=>b.classList.remove('active'));
    const active = document.querySelector(`.fm-tab[data-tab="${t}"]`);
    if(active) active.classList.add('active');
  }
  else if(r==='marketing') renderMarketing();
  else if(r==='telecaller1'||r==='telecaller2') renderTelecaller();
  else if(r==='sales') renderSales();
  else if(r==='closing') renderClosing();
}
function loadSectionData(){ renderForRole(); }

/* ════════════════════════════════════
   MARKETING EXECUTIVE
════════════════════════════════════ */
function renderMarketing(){
  const d=loadD('marketing');
  document.getElementById('main-content').innerHTML=`
  <div class="sec-hdr"><h2>📢 Marketing Report</h2><p>${PROJECTS[SESSION.project].name} | ${getPeriod()}</p></div>
  <div class="card">
    <div class="ctitle"><span class="ic">📥</span> Lead Generation</div>
    <div class="ig">
      <div class="ii"><label>Facebook Ads</label><input type="number" id="m-fb" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>Instagram Ads</label><input type="number" id="m-ig" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>Google Ads</label><input type="number" id="m-gg" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>WhatsApp / SMS</label><input type="number" id="m-wa" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>Referral</label><input type="number" id="m-ref" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>Hoarding / Offline</label><input type="number" id="m-off" min="0" placeholder="0" oninput="calcMkt()"></div>
    </div>
    <div class="dv"></div>
    <div class="mg">
      <div class="mc hl"><div class="ml">एकूण Leads</div><div class="mv" id="m-total">0</div></div>
      <div class="mc"><div class="ml">Digital</div><div class="mv" id="m-dig">0</div><div class="ms">FB+IG+Google</div></div>
      <div class="mc"><div class="ml">Offline</div><div class="mv" id="m-ofc">0</div></div>
    </div>
    <div id="m-bars"></div>
    <div class="dv"></div>
    <div class="ctitle" style="font-size:13px;">Marketing Spend</div>
    <div class="ig">
      <div class="ii"><label>Facebook (₹)</label><input type="number" id="m-spfb" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>Google (₹)</label><input type="number" id="m-spgg" min="0" placeholder="0" oninput="calcMkt()"></div>
      <div class="ii"><label>Offline Spend (₹)</label><input type="number" id="m-spoff" min="0" placeholder="0" oninput="calcMkt()"></div>
    </div>
    <div class="mg" style="margin-top:12px;">
      <div class="mc hl"><div class="ml">Total Spend</div><div class="mv" id="m-tsp">₹0</div></div>
      <div class="mc"><div class="ml">Cost Per Lead</div><div class="mv" id="m-cpl">₹0</div></div>
    </div>
    <div class="ii" style="margin-top:10px;"><label>Notes</label><textarea class="ta" id="m-notes" placeholder="Campaign observations..."></textarea></div>
    <button class="bsave" onclick="saveMkt()">💾 Save करा</button>
  </div>`;
  ['m-fb','m-ig','m-gg','m-wa','m-ref','m-off','m-spfb','m-spgg','m-spoff'].forEach(id=>setField(id,d));
  if(d['m-notes']) document.getElementById('m-notes').value=d['m-notes'];
  calcMkt();
}
function calcMkt(){
  const fb=getVal('m-fb'),ig=getVal('m-ig'),gg=getVal('m-gg'),wa=getVal('m-wa'),ref=getVal('m-ref'),off=getVal('m-off');
  const total=fb+ig+gg+wa+ref+off, dig=fb+ig+gg, ofc=wa+ref+off;
  document.getElementById('m-total').textContent=total;
  document.getElementById('m-dig').textContent=dig;
  document.getElementById('m-ofc').textContent=ofc;
  const sp=getVal('m-spfb')+getVal('m-spgg')+getVal('m-spoff');
  document.getElementById('m-tsp').textContent=fmtM(sp);
  document.getElementById('m-cpl').textContent=total>0?fmtM(Math.round(sp/total)):'₹0';
  const src=[{l:'Facebook',v:fb,c:'#1877F2'},{l:'Instagram',v:ig,c:'#E1306C'},{l:'Google',v:gg,c:'#EA4335'},{l:'WhatsApp',v:wa,c:'#25D366'},{l:'Referral',v:ref,c:'#C9A84C'},{l:'Offline',v:off,c:'#64748b'}].filter(s=>s.v>0);
  const mx=Math.max(...src.map(s=>s.v),1);
  document.getElementById('m-bars').innerHTML=src.map(s=>`<div style="margin-bottom:7px;"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;"><span style="font-weight:600;">${s.l}</span><span style="color:var(--navy);font-weight:700;">${s.v} (${pct(s.v,total)}%)</span></div><div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden;"><div style="height:100%;background:${s.c};border-radius:3px;width:${pct(s.v,mx)}%;"></div></div></div>`).join('');
}
function saveMkt(){
  const d={};
  ['m-fb','m-ig','m-gg','m-wa','m-ref','m-off','m-spfb','m-spgg','m-spoff'].forEach(id=>{d[id]=document.getElementById(id)?.value||'';});
  d['m-notes']=document.getElementById('m-notes').value;
  saveD('marketing',d); toast('✅ Marketing data save झाला!');
}

/* ════════════════════════════════════
   TELECALLER
════════════════════════════════════ */
function renderTelecaller(){
  const who = SESSION.role==='telecaller1'?'Telecaller 1':'Telecaller 2';
  const sec = SESSION.role==='telecaller1'?'tele1':'tele2';
  const d=loadD(sec);
  document.getElementById('main-content').innerHTML=`
  <div class="sec-hdr"><h2>📞 ${who} — Report</h2><p>${PROJECTS[SESSION.project].name} | ${getPeriod()}</p></div>
  <div class="card">

function downloadMyApp(){
  const role = SESSION.role;
  const proj = SESSION.project;
  if(!role) return;
  const roleLabel = ROLES[role].label;
  const projLabel = PROJECTS[proj]?.name||proj;

  // Get full HTML, inject locked role+project into login defaults
  let html = document.documentElement.outerHTML;

  // Pre-fill login defaults for this role
  const inject = `
<script>
window.addEventListener('DOMContentLoaded',function(){
  var rs=document.getElementById('l-role');
  var ps=document.getElementById('l-project');
  if(rs) rs.value='${role}';
  if(ps) ps.value='${proj}';
  var rb=document.querySelector('.ldemo');
  if(rb) rb.innerHTML='<b>${roleLabel}</b> — ${projLabel}<br>Password वापरून login करा.';
});
<\/script>`;

  html = html.replace('</body>', inject + '\n</body>');

  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `UniGravity_${roleLabel.replace(/\s+/g,'_')}_${projLabel.replace(/\s+/g,'_')}.html`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`✅ ${roleLabel} चा app download झाला!`);
}

   SERVICE WORKER — OFFLINE SUPPORT
════════════════════════════════════ */
if('serviceWorker' in navigator){
  const swCode = `
const CACHE='unigravity-v1';
const ASSETS=['/'];
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch',e=>{
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('/'))));
});`;
  const swBlob = new Blob([swCode],{type:'application/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

/* ════════════════════════════════════
   FIREBASE CONFIG & INIT
════════════════════════════════════ */
let db = null;
let fbApp = null;

function initFirebase(config){
  try {
    if(!firebase.apps.length){
      fbApp = firebase.initializeApp(config);
    } else {
      fbApp = firebase.apps[0];
    }
    db = firebase.firestore();
    db.settings({cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED});
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    SESSION.firebaseReady = true;
    toast('🔥 Firebase connected — Real-time sync active!');
    renderForRole();
  } catch(e){
    console.warn('Firebase init failed:', e);
    toast('⚠️ Firebase failed — Offline mode active');
  }
}

async function saveDSync(sec, d){
  saveD(sec, d); // always save locally first
  if(db && SESSION.firebaseReady){
    try {
      const docId = `${SESSION.project}_${getPeriod()}_${sec}`;
      await db.collection('reports').doc(docId).set({
        ...d, _project: SESSION.project, _period: getPeriod(),
        _section: sec, _updatedBy: SESSION.role,
        _updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e){ console.warn('Sync failed, saved locally'); }
  }
}

async function loadDSync(sec){
  if(db && SESSION.firebaseReady){
    try {
      const docId = `${SESSION.project}_${getPeriod()}_${sec}`;
      const snap = await db.collection('reports').doc(docId).get();
      if(snap.exists){
        const data = snap.data();
        saveD(sec, data); // update local cache
        return data;
      }
    } catch(e){ console.warn('Cloud load failed, using local'); }
  }
  return loadD(sec);
}

function doChangePassword(){
  const oldP = document.getElementById('pwd-old').value;
  const newP = document.getElementById('pwd-new').value;
  const conP = document.getElementById('pwd-confirm').value;
  const err  = document.getElementById('pwd-err');
  if(ROLES[SESSION.role].pass !== oldP){
    err.style.display='block'; err.textContent='❌ सध्याचा password चुकीचा आहे'; return;
  }
  if(newP.length < 4){
    err.style.display='block'; err.textContent='❌ नवीन password किमान ४ अक्षरे हवेत'; return;
  }
  if(newP !== conP){
    err.style.display='block'; err.textContent='❌ Confirm password जुळत नाही'; return;
  }
  // Save to localStorage per project
  const pwdKey = `rex_pwd_${SESSION.project}_${SESSION.role}`;
  localStorage.setItem(pwdKey, newP);
  ROLES[SESSION.role].pass = newP;
  document.getElementById('pwd-modal').remove();
  toast('✅ Password बदलला गेला!');
}

function calcFin(){
  const tok=getVal('f-tok'), ins=getVal('f-ins'), reg=getVal('f-reg');
  const target=getVal('f-target'), refund=getVal('f-refund');
  const total = tok+ins+reg;
  const net = total - refund;
  const ach = pct(total, target);
  const spend = getVal('f-mfb')+getVal('f-mgg')+getVal('f-moff')+getVal('f-ops');
  const dm = loadD('marketing');
  const leads = (parseFloat(dm['m-fb'])||0)+(parseFloat(dm['m-ig'])||0)+(parseFloat(dm['m-gg'])||0)+(parseFloat(dm['m-wa'])||0)+(parseFloat(dm['m-ref'])||0)+(parseFloat(dm['m-off'])||0);
  const cpl = leads>0 ? Math.round(spend/leads) : 0;
  const roi = spend>0 ? (total/spend).toFixed(1) : '0';

  const setT = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  setT('f-total', fmtM(total));
  setT('f-ach', ach+'%');
  setT('f-net', fmtM(net));
  setT('f-barlbl', ach+'%');
  setT('f-tspend', fmtM(spend));
  setT('f-cpl', fmtM(cpl));
  setT('f-roi', roi+'x');
  const bar = document.getElementById('f-bar');
  if(bar){ bar.style.width=Math.min(ach,100)+'%'; bar.className='pf '+(ach>=80?'g':ach>=50?'w':'r'); }
}

function saveFin(){
  const d={};
  ['f-tok','f-ins','f-reg','f-target','f-due','f-refund','f-mfb','f-mgg','f-moff','f-ops'].forEach(id=>{d[id]=document.getElementById(id)?.value||'';});
  saveDSync('finance',d);
  toast('✅ Finance save झाला!');
}

function showFirebaseModal(){
  const existing = document.getElementById('fb-modal');
  if(existing) existing.remove();
  const saved = localStorage.getItem('rex_firebase_config');
  const cfg = saved ? JSON.parse(saved) : {};
  const modal = document.createElement('div');
  modal.id = 'fb-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3);margin:auto;">
      <h3 style="font-size:16px;font-weight:700;color:#10253c;margin-bottom:4px;">🔥 Firebase Setup</h3>
      <p style="font-size:12px;color:#64748b;margin-bottom:16px;">Firebase console → Project Settings → Web App → Config copy करा</p>
      ${['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].map(k=>`
      <div style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;">${k}</label>
        <input id="fb-${k}" value="${cfg[k]||''}" placeholder="${k}" style="width:100%;padding:9px 11px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;">
      </div>`).join('')}
      <div id="fb-err" style="color:#dc2626;font-size:12px;margin:8px 0;display:none;"></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button onclick="document.getElementById('fb-modal').remove()" style="flex:1;padding:11px;border:1.5px solid #e2e8f0;background:#fff;border-radius:8px;font-size:14px;cursor:pointer;">रद्द करा</button>
        <button onclick="doSaveFirebase()" style="flex:1;padding:11px;background:#FF6600;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;">🔥 Connect करा</button>
      </div>
      <p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:12px;">Config तुमच्या device वर safe राहतो</p>
    </div>`;
  document.body.appendChild(modal);
}

function doSaveFirebase(){
  const keys = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
  const cfg = {};
  for(const k of keys){
    const val = document.getElementById('fb-'+k)?.value?.trim();
    if(!val){ document.getElementById('fb-err').style.display='block'; document.getElementById('fb-err').textContent='❌ सर्व fields भरा'; return; }
    cfg[k] = val;
  }
  localStorage.setItem('rex_firebase_config', JSON.stringify(cfg));
  document.getElementById('fb-modal').remove();
  // Load Firebase SDK and init
  const s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload = ()=>{
    const s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
    s2.onload = ()=>{ initFirebase(cfg); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

// Auto-load Firebase if config exists
window.addEventListener('load', ()=>{
  const saved = localStorage.getItem('rex_firebase_config');
  if(saved){
    try {
      const cfg = JSON.parse(saved);
      const s1 = document.createElement('script');
      s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
      s1.onload = ()=>{
        const s2 = document.createElement('script');
        s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
        s2.onload = ()=>{ initFirebase(cfg); };
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    } catch(e){}
  }
});
